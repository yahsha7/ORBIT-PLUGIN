name: ORBIT macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4

      - name: Check out JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: JUCE

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DORBIT_JUCE_SOURCE_DIR=${{ github.workspace }}/JUCE

      - name: Build plugins and tests
        run: >-
          cmake --build build --config Release --parallel 2
          --target ORBIT_VST3 ORBIT_Standalone OrbitTests

      - name: Sign and verify VST3 bundle
        run: |
          codesign --force --deep --sign - build/ORBIT_artefacts/Release/VST3/ORBIT.vst3
          codesign --verify --deep --strict build/ORBIT_artefacts/Release/VST3/ORBIT.vst3

      - name: Download pluginval
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip \
            --output "$RUNNER_TEMP/pluginval.zip"
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"

      - name: Validate VST3 compatibility
        run: |
          "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 \
            --validate-in-process \
            --output-dir "$RUNNER_TEMP/pluginval-logs" \
            build/ORBIT_artefacts/Release/VST3/ORBIT.vst3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-VST3-macOS
          path: build/ORBIT_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure